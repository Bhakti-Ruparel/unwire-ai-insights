version: "3.9"

# ══════════════════════════════════════════════════════════════════════════
# Unwire AI — PRODUCTION Docker Compose (Debian VPS)
# Frontend is deployed separately on Cloudflare Pages (no frontend container).
# Reads secrets from the root .env file via ${VAR} interpolation.
# Run:  docker compose -f docker-compose.prod.yml up -d
# ══════════════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unwire_ai
      POSTGRES_USER: unwire
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No public port — only the backend reaches it over the internal network.
    # Uncomment for host-only debugging:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unwire -d unwire_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # No public port — internal network only.
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: postgresql://unwire:${DB_PASSWORD:?DB_PASSWORD required}@postgres:5432/unwire_ai?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL required}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      INFRA_ENCRYPTION_KEY: ${INFRA_ENCRYPTION_KEY:?INFRA_ENCRYPTION_KEY required}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # ─── Optional (uncomment as needed) ─────────────────────────────────
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      # GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      # RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      # EMAIL_FROM: ${EMAIL_FROM:-}
      # SMTP_HOST: ${SMTP_HOST:-}
      # SMTP_PORT: ${SMTP_PORT:-587}
      # SMTP_USER: ${SMTP_USER:-}
      # SMTP_PASS: ${SMTP_PASS:-}
      # RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Database Migrations (runs once, then exits) ─────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://unwire:${DB_PASSWORD:?DB_PASSWORD required}@postgres:5432/unwire_ai?schema=public
    command: npx prisma migrate deploy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
