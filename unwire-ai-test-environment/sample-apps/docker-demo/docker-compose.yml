# Sample multi-service application for deployment testing
version: "3.8"

services:
  api:
    build: .
    container_name: docker-demo-api
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://demo:demo@db:5432/demo
      - REDIS_URL=redis://cache:6379
    depends_on:
      - db
      - cache
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: docker-demo-db
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - demo-pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: docker-demo-redis

volumes:
  demo-pgdata:
